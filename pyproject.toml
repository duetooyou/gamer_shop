[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamer-shop"
version = "0.1.0"
description = "Ядро магазина цифровых товаров: заказы, оплата по вебхуку, автовыдача от поставщика"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litestar[structlog,pydantic]>=2.24.0",
    "dishka>=1.10.1",
    "SQLAlchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pydantic-settings>=2.15.0",
    "taskiq>=0.12.6",
    "taskiq-redis>=1.2.3",
    "httpx>=0.28.1",
    "granian>=2.8.2",
    "structlog>=26.1.0",
    "orjson>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gamer_shop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# anyio-плагин отключён: два async-плагина сразу дают фикстурам и тестам
# РАЗНЫЕ циклы событий, и соединение к БД, созданное в фикстуре, ломается в тесте.
addopts = "-p no:anyio"

testpaths = ["tests"]
